<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Reporting System</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Add styles for the drag and drop area */
        .upload-area {
            border: 2px dashed #007bff;
            border-radius: 5px;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            margin: 20px auto;
            text-align: center;
            font-family: Arial, sans-serif;
            color: #007bff;
            background-color: #f9f9f9;
        }
        .upload-area.hover {
            border-color: #0056b3;
            background-color: #e9ecef;
        }
        .upload-area p {
            margin: 0;
            font-size: 18px;
        }
        .upload-area input[type="file"] {
            display: none;
        }
        #orders-list {
            margin: 20px auto;
            width: 100%;
            max-width: 600px;
        }
        #orders-list table {
            width: 100%;
            border-collapse: collapse;
        }
        #orders-list th, #orders-list td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }
        #orders-list th {
            background-color: #f4f4f4;
        }
        #orders-list td a {
            color: #007bff;
            text-decoration: none;
        }
        #orders-list td a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Order Reporting System</h1>

    <!-- Navigation Links -->
    <nav>
        <a href="#">Home</a>
        <a href="#upload-csv">Upload CSV</a>
        <a href="#view-orders">View Orders</a>
    </nav>

    <!-- CSV Upload Section with Drag and Drop -->
    <section id="upload-csv">
        <h2>Upload CSV</h2>
        <div class="upload-area" id="upload-area">
            <p>Drag & Drop CSV File Here or Click to Upload</p>
            <form id="upload-form" action="/upload" method="post" enctype="multipart/form-data">
                <input type="file" name="csvfile" accept=".csv" id="file-input">
                <button type="submit">Upload</button>
            </form>
        </div>
    </section>

    <!-- Orders List Section -->
    <section id="view-orders">
        <h2>Orders</h2>
        <div id="orders-list">
            <button id="select-all-btn">Select / Unselect All</button>
            <button id="generate-pdf-btn">Generate PDF</button>
            <table>
                <thead>
                    <tr>
                        <th><input type="checkbox" id="select-all"></th>
                        <th>Order Number</th>
                        <th>Order Date</th>
                    </tr>
                </thead>
                <tbody id="orders-table-body">
                    <!-- Orders will be populated here by JavaScript -->
                </tbody>
            </table>
        </div>
    </section>

    <script>
        // Handle drag and drop functionality
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const selectAllCheckbox = document.getElementById('select-all');
        const generatePdfBtn = document.getElementById('generate-pdf-btn');

        // Highlight drag area on hover
        uploadArea.addEventListener('dragover', (event) => {
            event.preventDefault();
            uploadArea.classList.add('hover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('hover');
        });

        // Handle file drop
        uploadArea.addEventListener('drop', (event) => {
            event.preventDefault();
            uploadArea.classList.remove('hover');

            const files = event.dataTransfer.files;
            if (files.length) {
                fileInput.files = files;
                document.getElementById('upload-form').submit();
            }
        });

        // Allow clicking on the upload area to trigger the file input
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // Submit the form when a file is selected via the input
        fileInput.addEventListener('change', () => {
            document.getElementById('upload-form').submit();
        });

        // Fetch and display orders
        function fetchOrders() {
            fetch('/api/list_orders')
                .then(response => response.json())
                .then(orders => {
                    const tbody = document.getElementById('orders-table-body');
                    tbody.innerHTML = ''; // Clear existing rows
                    orders.forEach(order => {
                        if (order && order.order_number && order.order_date) {
                            const row = document.createElement('tr');
                            row.innerHTML = `
                                <td><input type="checkbox" class="order-checkbox" value="${order.order_id}" checked></td>
                                <td>${order.order_number}</td>
                                <td>${order.order_date}</td>
                            `;
                            tbody.appendChild(row);
                        } else {
                            console.warn('Invalid order data:', order);
                        }
                    });
                });
        }

        // Handle Select All checkbox
        selectAllCheckbox.addEventListener('change', () => {
            const checkboxes = document.querySelectorAll('.order-checkbox');
            checkboxes.forEach(checkbox => {
                checkbox.checked = selectAllCheckbox.checked;
            });
        });

        // Handle Generate PDF button
        generatePdfBtn.addEventListener('click', () => {
            const selectedOrders = Array.from(document.querySelectorAll('.order-checkbox'))
                .filter(checkbox => checkbox.checked)
                .map(checkbox => checkbox.value);

            if (selectedOrders.length > 0) {
                // Use Fetch API to send a POST request with selected orders as JSON
                fetch('/api/generate_pdf', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ order_ids: selectedOrders }),
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.blob();  // Get the PDF as a Blob
                })
                .then(blob => {
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = 'order_report.pdf';  // Set the default file name
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                })
                .catch(error => {
                    console.error('Failed to generate PDF:', error);
                });
            } else {
                alert('Please select at least one order to generate the PDF.');
            }
        });

        // Fetch orders on page load
        window.onload = fetchOrders;
    </script>
</body>
</html>
